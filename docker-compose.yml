services:
  gacs:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      PORT: "4000"
      DATABASE_PATH: /data/submissions.sqlite
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:4000}
    volumes:
      # Real persistence: SQLite lives on the host disk, not an anonymous volume.
      - ${GACS_DATA_DIR:-./data}:/data
    restart: unless-stopped
